<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>EXIF orientation with only `width`</title>
    <desc>The height is derived from the oriented size of the image.</desc>

    <image id="image1" x="20" y="20" width="160"
           xlink:href="../../../resources/image-exif-orientation-6.jpg"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
