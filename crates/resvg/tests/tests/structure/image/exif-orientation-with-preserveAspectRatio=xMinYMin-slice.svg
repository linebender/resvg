<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>EXIF orientation with preserveAspectRatio='xMinYMin slice'</title>

    <image id="image1" x="20" y="20" width="80" height="160" preserveAspectRatio="xMinYMin slice"
