    <title>Transform on clipped nested svg</title>

    <svg id="svg2" width="100" height="100"
         transform="translate(50 50)" xmlns="http://www.w3.org/2000/svg">
        <rect id="rect1" width="150" height="150" fill="green"/>
    </svg>

