<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     font-family="Bitmap Mono" font-size="32">
    <title>A monochrome bitmap strike is painted with the text fill</title>

    <text id="text1" x="20" y="80" fill="green">Bitmap</text>
    <text id="text2" x="20" y="140" fill="green" fill-opacity="0.4">Bitmap</text>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
