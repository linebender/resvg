<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>color-interpolation=linearRGB</title>

    <linearGradient id="lg1" color-interpolation="linearRGB">
        <stop offset="0" stop-color="red"/>
        <stop offset="0.5" stop-color="lime"/>
        <stop offset="1" stop-color="black"/>
    </linearGradient>
    <linearGradient id="lg2">
        <stop offset="0" stop-color="red"/>
        <stop offset="0.5" stop-color="lime"/>
        <stop offset="1" stop-color="black"/>
    </linearGradient>

    <rect id="rect1" x="20" y="20" width="160" height="80" fill="url(#lg1)"/>
    <rect id="rect2" x="20" y="100" width="160" height="80" fill="url(#lg2)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
