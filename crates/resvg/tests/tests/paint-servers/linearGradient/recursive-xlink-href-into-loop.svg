<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Recursive `xlink:href` leading into a loop</title>

    <linearGradient id="lg1" xlink:href="#lg2"/>
    <linearGradient id="lg2" xlink:href="#lg1" spreadMethod="reflect"/>
    <linearGradient id="lg3" xlink:href="#lg1" x2="0.25">
        <stop offset="0" stop-color="white"/>
        <stop offset="1" stop-color="black"/>
    </linearGradient>

    <rect id="rect1" x="20" y="20" width="160" height="160" fill="url(#lg3)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
