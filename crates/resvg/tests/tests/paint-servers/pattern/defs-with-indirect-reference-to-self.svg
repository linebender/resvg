<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Defs with indirect reference to self</title>

    <pattern id="pattern1" width="20" height="20" patternUnits="userSpaceOnUse">
        <defs>
            <rect id="rect1" width="20" height="20" mask="url(#mask1)"/>
        </defs>
        <rect id="rect2" width="20" height="20" fill="white"/>
    </pattern>
    <mask id="mask1">
        <rect id="rect3" x="20" y="20" width="160" height="160" fill="url(#pattern1)"/>
    </mask>
    <rect id="rect4" x="22" y="22" width="156" height="156" fill="red"/>
    <rect id="rect5" x="20" y="20" width="160" height="160" fill="green" mask="url(#mask1)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
