<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Nested pattern inheriting a recursive fill</title>

    <pattern id="pattern1" width="200" height="200" patternUnits="userSpaceOnUse">
        <g id="g1" fill="url(#pattern1)">
            <rect id="rect1" x="20" y="20" width="160" height="160" fill="green"/>
            <pattern id="pattern2" width="200" height="200" patternUnits="userSpaceOnUse">
                <rect id="rect2" width="200" height="200"/>
            </pattern>
        </g>
    </pattern>
    <rect id="rect3" x="22" y="22" width="156" height="156" fill="red"/>
    <rect id="rect4" x="20" y="20" width="160" height="160" fill="url(#pattern2)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
