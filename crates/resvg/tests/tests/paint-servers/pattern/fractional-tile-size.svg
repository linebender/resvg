<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Fractional tile size</title>

    <pattern id="patt1" patternUnits="userSpaceOnUse" width="10.33" height="10.33">
        <rect id="rect1" width="5.165" height="5.165" fill="seagreen"/>
    </pattern>
    <rect id="rect2" x="20" y="20" width="160" height="160" fill="url(#patt1)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
