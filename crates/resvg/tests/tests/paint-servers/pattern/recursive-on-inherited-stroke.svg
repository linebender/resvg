<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Recursive on an inherited stroke</title>

    <g id="g1" stroke="url(#patt1)" stroke-width="40">
        <pattern id="patt1" patternUnits="userSpaceOnUse" width="20" height="20">
            <rect id="rect1" x="5" y="5" width="10" height="10" fill="green" stroke-width="4"/>
        </pattern>
        <rect id="rect2" x="40" y="40" width="120" height="120" fill="none"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
