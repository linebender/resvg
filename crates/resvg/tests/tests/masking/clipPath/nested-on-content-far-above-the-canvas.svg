<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Nested clip paths on content far above the canvas</title>

    <clipPath id="clip1">
        <rect id="rect1" x="0" y="-2000" width="200" height="2200"/>
    </clipPath>
    <g id="g1" clip-path="url(#clip1)">
        <g id="g2" clip-path="url(#clip1)">
            <rect id="rect2" x="0" y="-2000" width="200" height="1900" fill="red"/>
            <g id="g3" clip-path="url(#clip1)">
                <rect id="rect3" x="20" y="20" width="160" height="160" fill="green"/>
            </g>
        </g>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
