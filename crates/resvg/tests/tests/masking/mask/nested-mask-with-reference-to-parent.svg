<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Nested mask with reference to parent</title>

    <mask id="mask1">
        <mask id="mask2">
            <rect id="rect1" x="0" y="0" width="200" height="200" fill="white" mask="url(#mask1)"/>
        </mask>
    </mask>
    <rect id="rect2" x="20" y="20" width="160" height="160" fill="green"/>
    <rect id="rect3" x="20" y="20" width="160" height="160" fill="red" mask="url(#mask2)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
