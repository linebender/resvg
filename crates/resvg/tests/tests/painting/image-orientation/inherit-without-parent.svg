<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>`inherit` without parent</title>
    <desc>Must fall back to the initial `from-image` value and override the `style` element.</desc>

    <style id="style1">
        image { image-orientation: none }
    </style>
    <image id="image1" x="20" y="50" style="image-orientation:inherit"
           xlink:href="../../../resources/image-exif-orientation-6.jpg"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
