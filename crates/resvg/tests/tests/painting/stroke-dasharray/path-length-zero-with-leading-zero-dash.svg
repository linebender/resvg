<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>With zero `pathLength` and a leading zero dash</title>

    <path id="path1" d="M 20 100 H 180" fill="none" stroke="green" stroke-width="20"
          stroke-linecap="round" stroke-dasharray="0 10" pathLength="0"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
