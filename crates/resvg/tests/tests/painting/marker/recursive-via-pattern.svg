<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Recursive via pattern</title>

    <marker id="marker1" refX="20" refY="20" markerWidth="40" markerHeight="40"
            markerUnits="userSpaceOnUse">
        <rect id="rect1" x="2" y="2" width="36" height="36" fill="url(#patt1)" stroke="blue"
              stroke-width="4"/>
    </marker>
    <pattern id="patt1" patternUnits="userSpaceOnUse" width="20" height="20">
        <path id="path1" d="M 2 10 L 18 10" stroke="green" stroke-width="8"
              marker-start="url(#marker1)"/>
    </pattern>
    <rect id="rect2" x="20" y="100" width="160" height="80" fill="url(#patt1)"/>
    <path id="path2" d="M 50 50 L 150 50" stroke="black" stroke-width="2"
          marker-start="url(#marker1)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
