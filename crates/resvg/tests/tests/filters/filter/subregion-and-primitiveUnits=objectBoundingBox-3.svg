<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Subregion and primitiveUnits=objectBoundingBox (3)</title>

    <filter id="filter1" primitiveUnits="objectBoundingBox" x="-0.5" y="-0.5" width="2" height="2">
        <feGaussianBlur stdDeviation="0.01" x="0.25" y="0.25" width="0.5" height="0.5"/>
    </filter>
    <rect id="rect1" x="50" y="50" width="100" height="100" fill="seagreen" filter="url(#filter1)"/>

    <path id="crosshair" d="M 20 100 L 180 100 M 100 20 L 100 180"
          stroke="gray" stroke-width="0.5"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
