<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>With EXIF orientation</title>
    <desc>The image must fill the filter region upright.</desc>

    <filter id="filter1" x="0" y="0" width="1" height="1">
        <feImage xlink:href="../../../resources/image-exif-orientation-6.jpg"/>
    </filter>
    <rect id="rect1" x="20" y="50" width="160" height="100" fill="red" filter="url(#filter1)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
