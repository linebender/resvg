<svg width="300" height="300" xmlns="http://www.w3.org/2000/svg">
    <title>Dilation with a radius larger than the filter region. No red should be visible.</title>

    <filter id="dilate" filterUnits="userSpaceOnUse" x="50" y="50" width="200" height="200">
        <feMorphology operator="dilate" radius="200"/>
    </filter>
    <rect x="50" y="50" width="200" height="200" fill="red"/>
    <rect x="50" y="50" width="20" height="20" fill="green" filter="url(#dilate)"/>

    <!-- image frame -->
    <rect x="1" y="1" width="298" height="298" fill="none" stroke="black"/>
</svg>
